<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Iswift Gadgets</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/enhancements.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body class="dark-theme">
  <div id="site-header"></div>
  <main class="container checkout-page">
    <a href="cart.html" class="checkout-back">Back to bag</a>
    <h1>Checkout</h1>
    <div class="checkout-layout">
      <form id="checkoutForm">
        <section class="checkout-panel" aria-labelledby="contactHeading">
          <h2 id="contactHeading">Contact details</h2>
          <div class="checkout-fields">
            <label>Full name<input name="name" autocomplete="name" minlength="3" maxlength="120" required></label>
            <label>Mobile number<input name="phone" type="tel" autocomplete="tel-national" inputmode="numeric" pattern="[6-9][0-9]{9}" title="10-digit Indian mobile number" required></label>
            <label class="checkout-wide">Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
          </div>
        </section>

        <section class="checkout-panel" aria-labelledby="shippingHeading">
          <h2 id="shippingHeading">Shipping address</h2>
          <div class="checkout-fields">
            <label class="checkout-wide">Street address<textarea name="address" autocomplete="street-address" rows="2" maxlength="250" required></textarea></label>
            <label>City<input name="city" autocomplete="address-level2" maxlength="100" required></label>
            <label>State or union territory<input name="state" autocomplete="address-level1" maxlength="100" required></label>
            <label>PIN code<input name="pincode" inputmode="numeric" autocomplete="postal-code" pattern="[1-9][0-9]{5}" title="6-digit Indian PIN code" required></label>
            <label>Landmark <small>(optional)</small><input name="landmark" maxlength="150"></label>
            <p class="checkout-wide checkout-muted">Shipping destination: India</p>
          </div>
        </section>

        <section class="checkout-panel" aria-labelledby="paymentHeading">
          <h2 id="paymentHeading">Payment</h2>
          <div class="checkout-methods">
            <label><input type="radio" name="paymentMode" value="gateway" disabled>
              <span><strong>Pay online</strong><small id="gatewayDescription">Checking availability…</small></span>
            </label>
            <label><input type="radio" name="paymentMode" value="cod" checked>
              <span><strong>Cash on delivery</strong><small>Pay when your order arrives.</small></span>
            </label>
          </div>
          <p id="checkoutStatus" class="checkout-status" role="status"></p>
          <button id="placeOrder" class="btn btn-primary btn-lg" disabled>Place order</button>
        </section>
      </form>

      <aside class="order-summary" aria-labelledby="summaryHeading">
        <h2 id="summaryHeading">Order summary</h2>
        <div id="checkoutItems"></div>
        <div id="checkoutTotals" aria-live="polite"></div>
        <form id="couponForm">
          <label for="couponCode">Promo code</label>
          <div class="checkout-coupon"><input id="couponCode" maxlength="40"><button class="btn btn-outline">Apply</button></div>
        </form>
        <p id="quoteStatus" class="checkout-status" role="status">Calculating your total…</p>
        <button id="retryQuote" class="btn btn-outline" hidden>Refresh total</button>
      </aside>
    </div>
  </main>
  <div id="site-footer"></div>
  <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pricing-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js" defer></script>
</body>
</html>
