<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product | The Apple Store</title>
<meta id="pageDesc" name="description" content="Buy genuine Apple products in Pune with best prices and No-Cost EMI.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#63743;</text></svg>">
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/enhancements.css">
  <link rel="stylesheet" href="css/chip-family.css">
  <style>
    :root {
      --orange: #f56b23;
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --link: #2997ff;
    }

    /* MacBook Pro Hero ("Choose your Pro") */
    .models {
      background: #000;
      padding: 32px 24px 96px;
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .models__grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(24px, 4vw, 72px);
      width: min(1240px, 100%);
      margin: 0 auto;
    }

    /* ---------- Product column ---------- */
    .model {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .model__media {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .model__media img {
      display: block;
      width: min(100%, 520px);
      height: auto;
      user-select: none;
    }

    /* colour dots */
    .models .dots {
      display: flex;
      gap: 6px;
      margin-top: clamp(24px, 3vw, 44px);
      list-style: none;
      padding: 0;
    }
    .models .dots button {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: var(--c);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: outline-color .2s ease, transform .2s ease;
    }
    .models .dots button:hover { transform: scale(1.1); }
    .models .dots button[aria-pressed="true"] { outline-color: rgba(255,255,255,.55); }
    .models .dots button:focus-visible { outline-color: #2997ff; }

    .model__eyebrow {
      margin-top: clamp(32px, 4vw, 56px);
      font-size: 14.5px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--orange);
    }

    .model__title {
      margin-top: 22px;
      font-size: clamp(34px, 3.4vw, 40px);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .model__sub {
      min-height: 1.3em;
      margin-top: 14px;
      font-size: clamp(18px, 1.7vw, 21px);
      line-height: 1.2;
      font-weight: 600;
      color: #fff;
    }

    .model__desc {
      margin-top: 12px;
      min-height: 2.5em;            /* keeps the price rows level across columns */
      max-width: 450px;
      font-size: clamp(19px, 1.9vw, 23px);
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.012em;
      color: #fff;
    }

    .model__price {
      margin-top: 32px;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 500;
      color: #f5f5f7;
    }
    .model__price sup { font-size: .65em; line-height: 0; }

    .btn-learn {
      display: inline-block;
      margin-top: 56px;
      padding: 15px 30px;
      min-width: 176px;
      background: var(--blue);
      color: #fff !important;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 500;
      text-decoration: none;
      border-radius: 980px;
      transition: background .2s ease;
      text-align: center;
    }
    .btn-learn:hover { background: var(--blue-hover); color: #fff !important; }
    .btn-learn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .link-buy {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 22px;
      font-size: 21px;
      line-height: 1.2;
      color: var(--link) !important;
      text-decoration: none;
    }
    .link-buy:hover { text-decoration: underline; color: var(--link) !important; }
    .link-buy svg { width: 9px; height: 14px; }

    /* ---------- Entrance animation ---------- */
    .models .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);
      transition-delay: var(--d, 0s);
    }
    .models .reveal.is-visible,
    .models .reveal.in-view,
    .models .reveal.visible {
      opacity: 1;
      transform: none;
    }

    /* ---------- Mobile: stack ---------- */
    @media (max-width: 800px) {
      .models {
        padding: 24px 16px 64px;
      }
      .models__grid {
        grid-template-columns: 1fr;
        gap: 60px;
        width: 100%;
      }
      .model__desc { min-height: 0; }
      .btn-learn { margin-top: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .models .reveal { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>
<body class="dark-theme">
  <!-- Ambient luxury glow orbs -->
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>


<div id="site-header"></div>

<div id="productHeroContainer"></div>

<main class="container">
  <nav class="breadcrumb" id="breadcrumb"></nav>

  <div id="pdpContent"></div>

  <section class="related-section">
    <div class="section-head text-center" style="text-align:center; margin-bottom:24px;">
      <h2 style="font-size:28px; text-align:center;">You may also like</h2>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</main>

<div class="sticky-atc" id="stickyAtc"></div>

<div id="site-footer"></div>
<div id="whatsapp-float"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/catalog-sync.js"></script>
<script src="js/cart.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script src="js/animations.js" defer></script>
<script>
  const productId = getQueryParam("id") || getQueryParam("slug");
  if (productId === "macbook-air-13-m5" || productId === "macbook-air-15-m5" || productId === "mba-m3-13" || productId === "macbook-air") {
    window.location.replace("macbook-air.html");
  }
  if (productId === "iphone-18-pro" || productId === "iphone-18-pro-max" || productId === "iphone18pro") {
    window.location.replace("iphone-18-pro.html");
  }
  let product = getProductById(productId);
  if (!product && productId) {
    const searchMatches = searchProducts(productId);
    if (searchMatches && searchMatches.length) product = searchMatches[0];
  }
  if (!product) product = PRODUCTS[0];

  renderHeader(product.category);
  renderFooter();

  document.title = product.name + " | The Apple Store";
  document.getElementById("pageDesc").setAttribute("content", product.short + " Buy now in Pune with best price and No-Cost EMI.");

  const cat = getCategoryById(product.category);
  document.getElementById("breadcrumb").innerHTML =
    '<a href="index.html">Store</a><span>/</span>' +
    '<a href="category.html?cat=' + product.category + '">' + (cat ? cat.name : product.category) + '</a><span>/</span>' +
    '<span>' + product.name + '</span>';

  const selection = {
    color: product.colors[0] ? product.colors[0].name : "",
    storage: product.storageOptions[0] ? product.storageOptions[0].label : "",
    qty: 1
  };

  function currentImage() {
    const colorObj = product.colors.find(function (c) { return c.name === selection.color; });
    return (colorObj && colorObj.image) || product.images[0];
  }

  function currentUnitPrice() {
    const opt = product.storageOptions.find(function (o) { return o.label === selection.storage; });
    return product.price + (opt ? opt.extra : 0);
  }

  function renderPdp() {
    const discount = product.mrp > product.price ? Math.round((1 - product.price / product.mrp) * 100) : 0;
    const unitPrice = currentUnitPrice();
    const emi12 = getEmi(unitPrice, 12);
    const emi24 = getEmi(unitPrice, 24);
    const galleryImages = product.images.length > 1 ? product.images : [currentImage()];

    document.getElementById("pdpContent").innerHTML =
      '<div class="pdp-showcase-wrapper">' +

        '<!-- 1. Header Section Above Product Image -->' +
        '<div class="pdp-top-header text-center">' +
          '<div class="pc-cat">' + product.category + ' &middot; ' + product.brand + '</div>' +
          '<h1>' + product.name + '</h1>' +
          '<p class="pdp-short">' + product.short + '</p>' +
          '<div class="pdp-rating"><span class="stars">★★★★★</span> ' + product.rating + ' &middot; ' + product.reviews + ' ratings</div>' +
        '</div>' +

        '<!-- 2. Product Image Gallery (Top-Aligned) -->' +
        '<div class="pdp-gallery-hero">' +
          '<div class="pdp-gallery-main pdp-top-aligned" id="pdpGalleryMain">' +
            '<div class="pdp-3d-stage" id="pdp3dStage">' +
              '<img id="mainImage" src="' + currentImage() + '" alt="' + product.name + '">' +
            '</div>' +
          '</div>' +
          (galleryImages.length > 1 ?
            '<div class="pdp-thumbs" id="pdpThumbs">' +
              galleryImages.map(function (img, i) {
                return '<div class="pdp-thumb' + (i === 0 ? " active" : "") + '" data-img="' + img + '"><img src="' + img + '" alt="thumb"></div>';
              }).join("") +
            '</div>' : ''
          ) +
        '</div>' +

        '<!-- 3. Pricing, Configurator & Purchase Controls Below Image -->' +
        '<div class="pdp-purchase-container">' +
          '<!-- Left Column: Price, EMI, Colors, Storage, Qty & Stock (Left Aligned) -->' +
          '<div class="pdp-purchase-left">' +
            '<div class="pdp-price-block">' +
              '<div class="pdp-price-row">' +
                '<span class="pdp-price" id="pdpPrice">' + formatINR(unitPrice) + '</span>' +
                (discount ? '<span class="pdp-mrp">' + formatINR(product.mrp) + '</span><span class="pdp-discount">' + discount + '% OFF</span>' : '') +
              '</div>' +
              '<div class="pdp-emi-line">Starting from <strong id="pdpEmi">' + formatINR(emi12) + '/mo</strong> for 12 months, or ' + formatINR(emi24) + '/mo for 24 months.' +
                '<a href="#" id="emiToggle">View EMI plans</a>' +
              '</div>' +
              '<div id="emiPlans" style="display:none; margin-top:12px;">' +
                '<div class="emi-plan-list">' +
                  [3, 6, 9, 12, 18, 24].map(function (m) {
                    return '<div class="emi-plan"><span>' + m + ' months</span><span>' + formatINR(getEmi(unitPrice, m)) + '/mo</span></div>';
                  }).join("") +
                '</div>' +
              '</div>' +
            '</div>' +

            (product.colors.length ? colorPickerHtml() : '') +
            (product.storageOptions.length > 0 ? storagePickerHtml() : '') +

            '<div class="qty-row">' +
              '<div class="qty-selector">' +
                '<button id="qtyMinus">&minus;</button><span id="qtyVal">' + selection.qty + '</span><button id="qtyPlus">+</button>' +
              '</div>' +
              '<span class="stock-info' + (product.stock < 10 ? ' low' : '') + '">' +
                (product.stock < 10 ? 'Only ' + product.stock + ' left in stock' : 'In stock &middot; Ready to ship') +
              '</span>' +
            '</div>' +
          '</div>' +

          '<!-- Right Column: Action Buttons & Trust Badges (Right Aligned) -->' +
          '<div class="pdp-purchase-right">' +
            '<div class="pdp-actions">' +
              '<button class="btn btn-outline btn-lg" id="addToCartBtn">Add to Cart</button>' +
              '<button class="btn btn-primary btn-lg" id="buyNowBtn">Buy Now</button>' +
            '</div>' +

            '<a class="whatsapp-inline-btn" id="waInquiry" href="#" target="_blank" rel="noopener">' +
              icon("whatsapp", { size: 18 }) + ' Inquire on WhatsApp' +
            '</a>' +

            '<div class="trust-mini">' +
              '<div><span class="icon">' + icon("lock", { size: 16 }) + '</span>Secure Payment</div>' +
              '<div><span class="icon">' + icon("truck", { size: 16 }) + '</span>Fast Shipping</div>' +
              '<div><span class="icon">' + icon("checkCircle", { size: 16 }) + '</span>100% Genuine</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

      '</div>' +

      '<!-- 4. Product Description & Specifications Section -->' +
      '<section class="pdp-details" id="pdpDetails">' +
        '<div class="pdp-details-grid">' +
          '<div class="pdp-details-block">' +
            '<h3>Overview</h3>' +
            '<p class="pdp-desc">' + product.description + '</p>' +
            '<ul class="pdp-highlights">' +
              Object.keys(product.specs).slice(0, 4).map(function (k) {
                return '<li><strong>' + k + ':</strong> ' + product.specs[k] + '</li>';
              }).join("") +
            '</ul>' +
          '</div>' +
          '<div class="pdp-details-block">' +
            '<h3>Technical Specifications</h3>' +
            '<table class="spec-table">' +
              Object.keys(product.specs).map(function (k) {
                return '<tr><td>' + k + '</td><td>' + product.specs[k] + '</td></tr>';
              }).join("") +
            '</table>' +
          '</div>' +
        '</div>' +
      '</section>';

    wirePdpInteractions(unitPrice, emi12);
  }

  function colorPickerHtml() {
    return '<div class="option-group">' +
      '<label class="title">Color: <span class="sel-value" id="selColorLabel">' + selection.color + '</span></label>' +
      '<div class="swatches">' +
        product.colors.map(function (c) {
          return '<button class="swatch' + (c.name === selection.color ? ' active' : '') + '" style="background:' + c.hex + '" data-color="' + c.name + '" title="' + c.name + '"></button>';
        }).join("") +
      '</div>' +
    '</div>';
  }

  function storagePickerHtml() {
    return '<div class="option-group">' +
      '<label class="title">Storage: <span class="sel-value" id="selStorageLabel">' + selection.storage + '</span></label>' +
      '<div class="storage-options">' +
        product.storageOptions.map(function (o) {
          return '<button class="storage-opt' + (o.label === selection.storage ? ' active' : '') + '" data-storage="' + o.label + '">' + o.label + (o.extra ? ' (+' + formatINR(o.extra) + ')' : '') + '</button>';
        }).join("") +
      '</div>' +
    '</div>';
  }

  function wirePdpInteractions(unitPrice, emi12) {
    const galleryMain = document.getElementById("pdpGalleryMain");
    const mainImg = document.getElementById("mainImage");

    function changeProductImage(newSrc) {
      if (!mainImg || !newSrc) return;
      if (mainImg.getAttribute("src") === newSrc) return;
      mainImg.style.opacity = "0.3";
      setTimeout(function () {
        mainImg.src = newSrc;
        mainImg.style.opacity = "1";
      }, 150);
    }

    document.querySelectorAll(".swatch").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selection.color = btn.dataset.color;
        document.querySelectorAll(".swatch").forEach(function (s) { s.classList.remove("active"); });
        btn.classList.add("active");
        document.getElementById("selColorLabel").textContent = selection.color;
        changeProductImage(currentImage());
        updateStickyAtc();
      });
    });

    document.querySelectorAll(".storage-opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selection.storage = btn.dataset.storage;
        document.querySelectorAll(".storage-opt").forEach(function (s) { s.classList.remove("active"); });
        btn.classList.add("active");
        document.getElementById("selStorageLabel").textContent = selection.storage;
        renderPdp();
        updateStickyAtc();
      });
    });

    const thumbs = document.querySelectorAll(".pdp-thumb");
    thumbs.forEach(function (t) {
      t.addEventListener("click", function () {
        changeProductImage(t.dataset.img);
        thumbs.forEach(function (x) { x.classList.remove("active"); });
        t.classList.add("active");
      });
    });

    const qtyVal = document.getElementById("qtyVal");
    document.getElementById("qtyMinus").addEventListener("click", function () {
      selection.qty = Math.max(1, selection.qty - 1);
      qtyVal.textContent = selection.qty;
      updateStickyAtc();
    });
    document.getElementById("qtyPlus").addEventListener("click", function () {
      selection.qty = Math.min(product.stock, selection.qty + 1);
      qtyVal.textContent = selection.qty;
      updateStickyAtc();
    });

    document.getElementById("addToCartBtn").addEventListener("click", function () { handleAddToCart(); });
    document.getElementById("buyNowBtn").addEventListener("click", function () { handleBuyNow(); });

    const emiToggle = document.getElementById("emiToggle");
    emiToggle.addEventListener("click", function (e) {
      e.preventDefault();
      const panel = document.getElementById("emiPlans");
      panel.style.display = panel.style.display === "none" ? "block" : "none";
    });

    const waMsg = "Hi, I'm interested in the " + product.name + " (" + selection.color + (selection.storage ? ", " + selection.storage : "") + ") listed at " + formatINR(unitPrice) + " on The Apple Store. Could you share more details?";
    document.getElementById("waInquiry").href = whatsappLink(waMsg);
  }

  function handleAddToCart() {
    addToCart(product, {
      color: selection.color,
      storage: selection.storage,
      qty: selection.qty,
      unitPrice: currentUnitPrice(),
      image: currentImage()
    });
    showToast(product.name + " added to your bag");
  }

  function handleBuyNow() {
    addToCart(product, {
      color: selection.color,
      storage: selection.storage,
      qty: selection.qty,
      unitPrice: currentUnitPrice(),
      image: currentImage()
    });
    window.location.href = "checkout.html";
  }

  function updateStickyAtc() {
    const unitPrice = currentUnitPrice();
    document.getElementById("stickyAtc").innerHTML =
      '<div class="satc-price"><span class="price">' + formatINR(unitPrice) + '</span><span class="emi">From ' + formatINR(getEmi(unitPrice, 12)) + '/mo</span></div>' +
      '<button class="btn btn-outline" onclick="handleAddToCart()">Add to Cart</button>' +
      '<button class="btn btn-primary" onclick="handleBuyNow()">Buy Now</button>';
  }

  function relatedProductCard(p) {
    const discount = p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
    const badgeClass = p.badge === "New" ? "badge-new" : p.badge === "Sale" ? "badge-sale" : p.badge === "Best Seller" ? "badge-best-seller" : "";
    return (
      '<div class="product-card">' +
        (p.badge ? '<span class="product-badge ' + badgeClass + '">' + p.badge + '</span>' : '') +
        '<a href="product.html?id=' + p.id + '" class="pc-image"><img src="' + p.images[0] + '" alt="' + p.name + '"></a>' +
        '<div class="pc-cat">' + p.category + '</div>' +
        '<a href="product.html?id=' + p.id + '"><h4>' + p.name + '</h4></a>' +
        '<p class="pc-short">' + p.short + '</p>' +
        '<div class="pc-price-row"><span class="pc-price">' + formatINR(p.price) + '</span>' +
        (discount ? '<span class="pc-mrp">' + formatINR(p.mrp) + '</span>' : '') + '</div>' +
        '<div class="pc-emi">From <strong>' + formatINR(getEmi(p.price, 12)) + '/mo</strong></div>' +
        '<div class="pc-actions"><a href="product.html?id=' + p.id + '" class="btn btn-dark btn-block">View Details</a></div>' +
      '</div>'
    );
  }

  
  function renderMbpHero() {
    const heroContainer = document.getElementById("productHeroContainer");
    if (!heroContainer) return;

    const isMbp16 = (product && product.id === "macbook-pro-16-m5") || productId === "macbook-pro-16-m5";
    const isMbp14 = (product && product.id === "macbook-pro-14-m5") || productId === "macbook-pro-14-m5";

    if (!isMbp16 && !isMbp14) {
      heroContainer.innerHTML = "";
      return;
    }

    const leftLearnHref = isMbp16 ? "#pdpDetails" : "product.html?id=macbook-pro-16-m5#pdpDetails";
    const leftBuyHref = isMbp16 ? "#pdpContent" : "product.html?id=macbook-pro-16-m5#pdpContent";
    const rightLearnHref = isMbp14 ? "#pdpDetails" : "product.html?id=macbook-pro-14-m5#pdpDetails";
    const rightBuyHref = isMbp14 ? "#pdpContent" : "product.html?id=macbook-pro-14-m5#pdpContent";

    heroContainer.innerHTML =
      '<section class="models" aria-label="Choose your MacBook Pro">' +
        '<div class="models__grid">' +

          '<!-- Left : PROLED XDR -->' +
          '<article class="model reveal" style="--d:0s">' +
            '<div class="model__media">' +
              '<img src="images/macbook-pro/mbp_proled_xdr__6kmaoqc3m7my_large_2x.avif" alt="Two MacBook Pro laptops with PROLED XDR displays showing abstract light streaks">' +
            '</div>' +

            '<ul class="dots" aria-label="Finish">' +
              '<li><button type="button" style="--c:#2e2e30" aria-pressed="true" aria-label="Space Black" data-color="Space Black"></button></li>' +
              '<li><button type="button" style="--c:#e3e4e6" aria-pressed="false" aria-label="Silver" data-color="Silver"></button></li>' +
            '</ul>' +

            '<p class="model__eyebrow">New</p>' +
            '<h2 class="model__title">MacBook Pro</h2>' +
            '<p class="model__sub">PROLED XDR Display</p>' +
            '<p class="model__desc">The most advanced MacBook Pro with the world\u2019s best laptop display.</p>' +

            '<p class="model__price">' +
              'From \u20b9349900.00<sup>*</sup><br>' +
              'or \u20b955817.00/mo. for 6 mo.<sup>\u2021</sup>' +
            '</p>' +

            '<a class="btn-learn" href="' + leftLearnHref + '">Learn more</a>' +
            '<a class="link-buy" href="' + leftBuyHref + '">Buy ' +
              '<svg viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L7 7l-5.5 5.5"/></svg>' +
            '</a>' +
          '</article>' +

          '<!-- Right : 14\u2033 with M6 -->' +
          '<article class="model reveal" style="--d:.18s">' +
            '<div class="model__media">' +
              '<img src="images/macbook-pro/mbp__gc3ay8k5kaie_large_2x.avif" alt="Two MacBook Pro laptops in Space Black showing a flowing monochrome wallpaper">' +
            '</div>' +

            '<ul class="dots" aria-label="Finish">' +
              '<li><button type="button" style="--c:#2e2e30" aria-pressed="true" aria-label="Space Black" data-color="Space Black"></button></li>' +
              '<li><button type="button" style="--c:#e3e4e6" aria-pressed="false" aria-label="Silver" data-color="Silver"></button></li>' +
            '</ul>' +

            '<p class="model__eyebrow">New 14\u2033 with M6</p>' +
            '<h2 class="model__title">MacBook Pro</h2>' +
            '<p class="model__sub" aria-hidden="true"></p>' +
            '<p class="model__desc">A powerful laptop for every kind of pro.</p>' +

            '<p class="model__price">' +
              'From \u20b9239900.00<sup>*</sup><br>' +
              'or \u20b937483.00/mo. for 6 mo.<sup>\u2021</sup>' +
            '</p>' +

            '<a class="btn-learn" href="' + rightLearnHref + '">Learn more</a>' +
            '<a class="link-buy" href="' + rightBuyHref + '">Buy ' +
              '<svg viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L7 7l-5.5 5.5"/></svg>' +
            '</a>' +
          '</article>' +

        '</div>' +
      '</section>';

    // Colour dots toggle
    heroContainer.querySelectorAll(".dots").forEach(function (group) {
      const btns = Array.prototype.slice.call(group.querySelectorAll("button"));
      btns.forEach(function (b) {
        b.addEventListener("click", function () {
          btns.forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
          const chosenColor = b.getAttribute("data-color");
          if (chosenColor) {
            const swatchBtn = document.querySelector('.swatch[data-color="' + chosenColor + '"]');
            if (swatchBtn) swatchBtn.click();
          }
        });
      });
    });

    // Reveal columns as they scroll into view
    const reveals = heroContainer.querySelectorAll(".reveal");
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.classList.add("is-visible");
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      reveals.forEach(function (el) { io.observe(el); });
    } else {
      reveals.forEach(function (el) { el.classList.add("is-visible"); });
    }

    // Smooth scroll for internal anchor links (#pdpDetails, #pdpContent)
    heroContainer.querySelectorAll('a[href^="#"]').forEach(function (link) {
      link.addEventListener("click", function (e) {
        const hash = link.getAttribute("href");
        const target = document.querySelector(hash);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          if (history.pushState) {
            history.pushState(null, "", hash);
          }
        }
      });
    });
  }

  function syncProductFromCatalog() {
    let updatedP = getProductById(productId);
    if (!updatedP && productId) {
      const searchMatches = searchProducts(productId);
      if (searchMatches && searchMatches.length) updatedP = searchMatches[0];
    }
    if (updatedP) {
      product = updatedP;
      document.title = product.name + " | The Apple Store";
      document.getElementById("pageDesc").setAttribute("content", product.short + " Buy now in Pune with best price and No-Cost EMI.");
      const cat = getCategoryById(product.category);
      document.getElementById("breadcrumb").innerHTML =
        '<a href="index.html">Store</a><span>/</span>' +
        '<a href="category.html?cat=' + product.category + '">' + (cat ? cat.name : product.category) + '</a><span>/</span>' +
        '<span>' + product.name + '</span>';
      renderPdp();
      renderMbpHero();
      updateStickyAtc();
      const related = PRODUCTS.filter(function (p) { return p.category === product.category && p.id !== product.id; }).slice(0, 4);
      document.getElementById("relatedGrid").innerHTML = related.map(relatedProductCard).join("");
    }
  }

  const related = PRODUCTS.filter(function (p) { return p.category === product.category && p.id !== product.id; }).slice(0, 4);
  document.getElementById("relatedGrid").innerHTML = related.map(relatedProductCard).join("");

  renderPdp();
  renderMbpHero();
  updateStickyAtc();
  document.body.classList.add("has-sticky-atc");
  document.addEventListener("catalog:updated", syncProductFromCatalog);
</script>
</body>
