<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel | Iswift Gadgets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#63743;</text></svg>">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <section id="loginView" class="login-view">
    <form class="login-card" id="loginForm">
      <div class="login-brand">Iswift Gadgets</div>
      <h1>Control Panel</h1>
      <p class="muted">Sign in to manage products, coupons, orders and store settings.</p>
      <label id="loginPasswordLabel" for="loginPassword">Admin password</label>
      <input type="password" id="loginPassword" placeholder="Enter admin password" autocomplete="current-password" required>
      <button type="submit" id="loginSubmit" class="btn btn-primary btn-block" disabled>Checking connection...</button>
      <p class="hint" id="connectionNotice" role="status"></p>
      <button type="button" id="retryConnection" class="btn btn-ghost btn-block" hidden>Retry connection</button>
      <p class="error-msg" id="loginError" hidden></p>
    </form>
  </section>

  <!-- SHELL -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <strong>Iswift</strong>
        <span>Control Panel</span>
      </div>
      <nav class="sidebar-nav">
        <button type="button" data-view="dashboard" class="nav-btn active">
          <svg class="icon-svg icon-dashboard" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
        </button>
        <button type="button" data-view="products" class="nav-btn">
          <svg class="icon-svg icon-product" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8L12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v10"/></svg>
          Products
        </button>
        <button type="button" data-view="banners" class="nav-btn">
          <svg class="icon-svg icon-banner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Banners & Ads
        </button>
        <button type="button" data-view="coupons" class="nav-btn">
          <svg class="icon-svg icon-coupon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Coupons
        </button>
        <button type="button" data-view="orders" class="nav-btn">
          <svg class="icon-svg icon-truck" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="12" height="10" rx="1.2"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="1.7"/><circle cx="17.5" cy="19" r="1.7"/></svg>
          Orders
        </button>
        <button type="button" data-view="settings" class="nav-btn">
          <svg class="icon-svg icon-settings" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
      </nav>
      <div class="sidebar-foot">
        <a href="../index.html" target="_blank" rel="noopener">
          <svg class="icon-svg icon-store" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5l1-5h15l1 5"/><path d="M4 9.5V20h16V9.5"/><path d="M9.5 20v-6h5v6"/><path d="M3.5 9.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/></svg>
          View storefront
          <svg class="icon-svg icon-arrowUpRight" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg>
        </a>
        <button type="button" id="logoutBtn" class="btn btn-ghost btn-block">
          <svg class="icon-svg icon-logout" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log out
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

</div>

<!-- Product modal -->
<dialog id="productModal" class="modal">
  <form method="dialog" id="productForm" class="modal-card">
    <header>
      <h3 id="productModalTitle">Add product</h3>
      <button type="button" class="icon-x" data-close="productModal" aria-label="Close">
        <svg class="icon-svg icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal-body grid-2">
      <input type="hidden" id="p_id_existing">
      <label>Name<input id="p_name" required></label>
      <label>ID / slug<input id="p_id" placeholder="auto from name if empty"></label>
      <label>Category
        <select id="p_category">
          <option value="iphone">iPhone</option>
          <option value="mac">Mac</option>
          <option value="ipad">iPad</option>
          <option value="watch">Watch</option>
          <option value="vision">Vision</option>
          <option value="airpods">AirPods</option>
          <option value="tvhome">TV & Home</option>
          <option value="accessories">Accessories</option>
        </select>
      </label>
      <label>Badge
        <select id="p_badge">
          <option value="">None</option>
          <option value="New">New</option>
          <option value="Sale">Sale</option>
          <option value="Best Seller">Best Seller</option>
        </select>
      </label>
      <label>Price (₹)<input id="p_price" type="number" min="0" step="1" required></label>
      <label>MRP (₹)<input id="p_mrp" type="number" min="0" step="1"></label>
      <label>Stock<input id="p_stock" type="number" min="0" step="1" value="10"></label>
      <label>Brand<input id="p_brand" value="Apple"></label>
      <div class="span-2" style="background:#f8f9fa;padding:12px;border-radius:8px;border:1px dashed #ccc;">
        <label style="font-weight:600;margin-bottom:4px;display:block;">Main Product Image</label>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <input id="p_image" placeholder="images/products/example.png" style="flex:1;">
          <label class="btn btn-ghost btn-sm" style="margin:0;cursor:pointer;background:#fff;border:1px solid #ccc;">
            <svg class="icon-svg icon-upload" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M7 8.5L12 4l5 4.5"/><path d="M4 15v3.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V15"/></svg> Upload File <input type="file" id="p_image_file" accept="image/*" style="display:none;">
          </label>
        </div>
        <div id="p_image_preview_wrap" style="margin-top:8px;display:none;align-items:center;">
          <img id="p_image_preview" src="" style="max-height:90px;border-radius:6px;border:1px solid #ddd;object-fit:cover;">
          <span class="muted" style="font-size:12px;margin-left:8px;" id="p_image_status"></span>
        </div>
      </div>
      <!-- Color Variants Section -->
      <div class="span-2" style="background:#f8f9fa;padding:14px;border-radius:10px;border:1px solid #e0e0e0;margin-top:4px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div>
            <strong style="font-size:14px;color:#1d1d1f;display:block;">Product Color Variants</strong>
            <span class="muted" style="font-size:12px;">Add different colors for this product (name, color swatch, and image).</span>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="p_add_color_btn" style="background:#fff;border:1px solid #ccc;font-weight:600;">
            <svg class="icon-svg icon-plus" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Add Color
          </button>
        </div>
        
        <div id="p_colors_list" style="display:flex;flex-direction:column;gap:10px;">
          <!-- Dynamically populated color rows -->
        </div>
      </div>
      <label class="span-2">Short description<textarea id="p_short" rows="2"></textarea></label>
      <label class="span-2">Full description<textarea id="p_description" rows="3"></textarea></label>
    </div>
    <footer>
      <button type="button" class="btn btn-ghost" data-close="productModal">Cancel</button>
      <button type="submit" class="btn btn-primary" id="productSaveBtn">Save product</button>
    </footer>
  </form>
</dialog>

<!-- Banner / Advertisement modal -->
<dialog id="bannerModal" class="modal">
  <form method="dialog" id="bannerForm" class="modal-card">
    <header>
      <h3 id="bannerModalTitle">Add Banner / Advertisement</h3>
      <button type="button" class="icon-x" data-close="bannerModal" aria-label="Close">
        <svg class="icon-svg icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal-body grid-2">
      <input type="hidden" id="b_id_existing">
      <label>Title<input id="b_title" placeholder="iPhone Duo Event" required></label>
      <label>ID / slug<input id="b_id" placeholder="auto from title if empty"></label>
      <label>Placement
        <select id="b_placement">
          <option value="hero">Hero Main Banner</option>
          <option value="top_strip">Top Promo Announcement Strip</option>
          <option value="category_hero">Category Promo Banner</option>
          <option value="footer_promo">Footer Promo Banner</option>
        </select>
      </label>
      <label>Target Category
        <select id="b_category">
          <option value="all">All Storefront Pages</option>
          <option value="iphone">iPhone Category</option>
          <option value="mac">Mac Category</option>
          <option value="ipad">iPad Category</option>
          <option value="watch">Watch Category</option>
          <option value="vision">Vision Category</option>
          <option value="airpods">AirPods Category</option>
          <option value="tvhome">TV & Home</option>
          <option value="accessories">Accessories</option>
        </select>
      </label>
      <label>Badge / Tagline<input id="b_badge" placeholder="Pre-order starting 16 October"></label>
      <label>Button Text<input id="b_btnText" value="Learn More" placeholder="Learn More / Buy Now"></label>
      <div class="span-2" style="background:#f8f9fa;padding:12px;border-radius:8px;border:1px dashed #ccc;">
        <label style="font-weight:600;margin-bottom:4px;display:block;">Banner Image</label>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <input id="b_image" placeholder="images/hero/iphone_duo__hefmlegzwbmi_large_2x.png" required style="flex:1;">
          <label class="btn btn-ghost btn-sm" style="margin:0;cursor:pointer;background:#fff;border:1px solid #ccc;">
            <svg class="icon-svg icon-upload" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M7 8.5L12 4l5 4.5"/><path d="M4 15v3.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V15"/></svg> Upload File <input type="file" id="b_image_file" accept="image/*" style="display:none;">
          </label>
        </div>
        <div id="b_image_preview_wrap" style="margin-top:8px;display:none;align-items:center;">
          <img id="b_image_preview" src="" style="max-height:90px;border-radius:6px;border:1px solid #ddd;object-fit:cover;">
          <span class="muted" style="font-size:12px;margin-left:8px;" id="b_image_status"></span>
        </div>
      </div>
      <label class="span-2">Target URL / Link<input id="b_link" placeholder="category.html?cat=iphone" required></label>
      <label class="span-2">Subtitle / Description<textarea id="b_subtitle" rows="2" placeholder="Describe the promotion or advertisement campaign..."></textarea></label>
      <label>Display Sort Order<input id="b_sortOrder" type="number" value="1" min="0"></label>
      <label class="checkbox-row" style="margin-top:24px"><input type="checkbox" id="b_active" checked> Active on storefront</label>
    </div>
    <footer>
      <button type="button" class="btn btn-ghost" data-close="bannerModal">Cancel</button>
      <button type="submit" class="btn btn-primary" id="bannerSaveBtn">Save Banner</button>
    </footer>
  </form>
</dialog>

<!-- Coupon modal -->
<dialog id="couponModal" class="modal">
  <form method="dialog" id="couponForm" class="modal-card">
    <header>
      <h3 id="couponModalTitle">Add coupon</h3>
      <button type="button" class="icon-x" data-close="couponModal" aria-label="Close">
        <svg class="icon-svg icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal-body grid-2">
      <input type="hidden" id="c_id">
      <label>Code<input id="c_code" placeholder="WELCOME10" required style="text-transform:uppercase"></label>
      <label>Type
        <select id="c_type">
          <option value="percent">Percent (%)</option>
          <option value="fixed">Fixed (₹)</option>
        </select>
      </label>
      <label>Value<input id="c_value" type="number" min="1" step="1" required></label>
      <label>Min order (₹)<input id="c_minOrder" type="number" min="0" step="1" value="0"></label>
      <label>Max discount (₹)<input id="c_maxDiscount" type="number" min="0" step="1" placeholder="optional"></label>
      <label>Usage limit<input id="c_usageLimit" type="number" min="1" step="1" placeholder="unlimited"></label>
      <label>Starts<input id="c_startsAt" type="date"></label>
      <label>Ends<input id="c_endsAt" type="date"></label>
      <label class="span-2 checkbox-row"><input type="checkbox" id="c_active" checked> Active</label>
      <label class="span-2">Note<textarea id="c_note" rows="2" placeholder="Internal note"></textarea></label>
    </div>
    <footer>
      <button type="button" class="btn btn-ghost" data-close="couponModal">Cancel</button>
      <button type="submit" class="btn btn-primary">Save coupon</button>
    </footer>
  </form>
</dialog>

<script src="../js/data.js"></script>
<script src="../js/icons.js"></script>
<script src="js/demo-store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
